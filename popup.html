<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Tab Mind Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 380px;
      padding: 12px;
      margin: 0;
    }

    h1 {
      font-size: 18px;
      margin: 0 0 10px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    #status {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .cluster {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
      background: #f9f9f9;
    }

    .cluster-title {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .cluster-summary {
      font-size: 12px;
      color: #555;
      margin-bottom: 8px;
    }

    .tab-item {
      font-size: 13px;
      margin-left: 10px;
      margin-bottom: 4px;
    }

    .relationships {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #ddd;
    }

    .relationship-item {
      font-size: 12px;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h1>Tab Mind Map</h1>
  <button id="generate">Generate Mind Map</button>
  <div id="status"></div>
  <div id="mindmap"></div>

  <script src="popup.js"></script>
</body>
</html>
