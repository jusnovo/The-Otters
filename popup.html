<!DOCTYPE html>
<html>
<body style="width: 350px; padding: 15px; font-family: system-ui;">
  <h2 style="margin-top:0">Tab-Stash 🌬️</h2>
  <p style="font-size: 0.85rem; color: #666;">Ready to archive your FOMO?</p>
  
  <button id="inhaleBtn" style="width: 100%; padding: 10px; background: #4285f4; color: white; border: none; border-radius: 4px; cursor: pointer;">
    Capture All Tabs
  </button>

  <div id="status" style="margin-top: 10px; font-size: 0.8rem; color: #34a853;"></div>
  
  <pre id="output" style="max-height: 200px; overflow: auto; background: #f4f4f4; padding: 10px; font-size: 11px; margin-top: 10px; border-radius: 4px; display: none;"></pre>
  
  <script src="popup.js"></script>
</body>
</html>
